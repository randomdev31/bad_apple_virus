name: Build Binary

on:
  push:
    branches: [ master, main ]
    tags: ['v*']  # <--- 1. Add tag trigger so pushing a tag runs the workflow
  pull_request:
    branches: [ master, main ]
    # Remove 'release:' trigger since pushing a tag handles it cleanly

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bad_apple.exe
            asset_name: bad_apple-windows

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # (Your cache steps remain the same...)

    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # <--- 2. Ensure it only runs on version tags

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Create Release with Binaries
      uses: softprops/action-gh-release@v2  # <--- 3. Updated to v2 (recommended)
      with:
        files: |
          release-artifacts/bad_apple-windows/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
